<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Clothing Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">
    <header class="site-header">
        <nav class="site-nav page-width" aria-label="Main navigation">
            <a class="brand" href="index.html">STORE<span>.</span></a>
            <div class="nav-links"><a class="nav-button" href="index.html">Home</a><a class="nav-button"
                    href="dashboard.html">Shop</a><a class="nav-button" href="cart.html">Bag <span
                        class="cart-count">0</span></a><a class="nav-button" href="login.html">Sign in</a></div>
        </nav>
    </header>
    <main class="register-shell page-width">
        <section class="login" aria-labelledby="register-title">
            <div class="hader">
                <h1 id="register-title">Register</h1>
                <p>New account</p>
            </div>
            <form class="register-form" id="register-form">
                <input type="text" id="register-name" placeholder="Full name" required>
                <input type="email" id="register-email" placeholder="Email address" required>
                <input type="password" id="register-password" placeholder="Password" minlength="4" required>
                <input type="password" id="register-confirm" placeholder="Confirm password" minlength="4" required>
                <button type="submit">Register</button>
                <span id="register-message" aria-live="polite"></span>
                <span>Already have an account? <a href="login.html">Sign in</a></span>
            </form>
        </section>
    </main>
    <script src="auth.js"></script>
    <script>
        document.querySelector("#register-form").addEventListener("submit", (event) => {
            event.preventDefault();
            const password = document.querySelector("#register-password").value;
            const confirm = document.querySelector("#register-confirm").value;
            const message = document.querySelector("#register-message");
            if (password !== confirm) {
                message.textContent = "Passwords do not match.";
                return;
            }
            localStorage.setItem("store-user", document.querySelector("#register-email").value);
            window.location.href = "dashboard.html";
        });
    </script>
</body>

</html>
