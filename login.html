<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Clothing Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation"><a class="brand" href="index.html">STORE<span>.</span></a>
            <div class="nav-links"><a class="nav-button" href="index.html">Home</a><a class="nav-button"
                    href="dashboard.html">Shop</a><a class="nav-button" href="cart.html">Bag <span
                        class="cart-count">0</span></a></div>
        </nav>
    </header>
    <main class="auth-shell page-width">
        <section class="auth-copy">
            <p class="eyebrow">Login</p>
            <h1>Welcome<br><em>back.</em></h1>
            <p>Enter your details.</p>
        </section>
        <form class="auth-card" id="login-form">
            <p class="eyebrow">Member access</p>
            <h2>Sign in</h2><label for="email">Email address</label><input id="email" type="email" required
                placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password"
                required minlength="4" placeholder="At least 4 characters"><button class="solid-button full"
                type="submit">Continue</button>
            <p class="form-message" aria-live="polite"></p>
            <a class="account-link" href="register.html">Register</a>
        </form>
    </main>
    <script src="auth.js"></script>
    <script>document.querySelector("#login-form").addEventListener("submit", (event) => { event.preventDefault(); localStorage.setItem("store-user", document.querySelector("#email").value); window.location.href = "dashboard.html"; });</script>
</body>

</html>
